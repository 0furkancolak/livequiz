name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore LiveQuiz.sln
      - name: Build
        run: dotnet build LiveQuiz.sln --no-restore -c Release
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - name: Test (unit, integration and Playwright E2E)
        run: dotnet test --solution LiveQuiz.sln --no-build -c Release
      - name: Docker images build
        run: docker compose build
