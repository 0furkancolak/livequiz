# Two Api instances (one Orleans silo each) behind the Web app, on one PostgreSQL.
#   docker compose up --build        then open http://localhost:8080
# The AppHost (src/LiveQuiz.AppHost) remains the development path; this file runs the same topology from images.
x-api: &api
  build:
    context: .
    dockerfile: docker/Dockerfile.api
  image: livequiz-api
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - keys:/keys
  environment: &api-env
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__livequizdb: Host=postgres;Database=livequizdb;Username=postgres;Password=${POSTGRES_PASSWORD:-livequiz-dev}
    Database__MigrateOnStartup: "true"
    Cluster__Provider: AdoNet
    Cluster__SiloPort: "11111"
    Cluster__GatewayPort: "30000"

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livequiz-dev}
      POSTGRES_DB: livequizdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livequizdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  api-1:
    <<: *api
    hostname: api-1
    environment:
      <<: *api-env
      Cluster__AdvertisedHost: api-1

  api-2:
    <<: *api
    hostname: api-2
    environment:
      <<: *api-env
      Cluster__AdvertisedHost: api-2

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: livequiz-web
    depends_on: [api-1, api-2]
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - keys:/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__Instances: api-1,api-2
      services__api-1__http__0: http://api-1:8080
      services__api-2__http__0: http://api-2:8080

volumes:
  pgdata:
  keys:
